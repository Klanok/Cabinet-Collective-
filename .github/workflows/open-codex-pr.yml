name: Open Codex pull request

on:
  push:
    branches:
      - 'codex/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: Open pull request when needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh pr view "$BRANCH" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "A pull request already exists for $BRANCH."
            exit 0
          fi

          title="$(git log -1 --pretty=%s)"
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "Automatically opened for the pushed Codex branch. CI must pass before this is merged."
